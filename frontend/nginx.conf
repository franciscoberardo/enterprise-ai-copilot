server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
    }

    location /agent-api/ {
        proxy_pass http://agent:8000/;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
